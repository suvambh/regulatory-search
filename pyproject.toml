[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"


[project]
name = "regulatory-engine"
version = "0.1.0"
description = "EU import regulatory and tariff search engine"
requires-python = ">=3.12"

dependencies = [
    # AWS: Bedrock + Textract
    "boto3",

    # PostgreSQL / pgvector queries
    "psycopg[binary]",

    # PDF extraction; `import fitz` comes from PyMuPDF
    "PyMuPDF",

    # AWS Textract helpers
    "amazon-textract-caller",
    "amazon-textract-prettyprinter",
    "amazon-textract-response-parser",
]




[project.optional-dependencies]
dev = [
    "pytest",
]

ui = [
    "streamlit",
]


[tool.setuptools.packages.find]
where = ["src"]
include = ["regulatory_engine*"]
namespaces = false


[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

markers = [
    "integration: tests requiring database and AWS Bedrock access",
]